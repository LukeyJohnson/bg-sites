site_name: Black Grid
site_description: Software built and hosted by Black Grid for construction and project delivery.
site_url: https://lukeyjohnson.github.io/bg-sites/
repo_url: https://github.com/lukeyjohnson/bg-sites/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

nav:
  - Home: index.md
  - DS Pro:
      - Overview: ds-pro/index.md
      - DS Pro (Technical): ds-pro/technical.md
      - DS Harmony (Field): ds-pro/harmony.md
      - DS Horizon (Ops): ds-pro/horizon.md
      - Site and Mobile: siteapp.md
      - Changelog:
          - Overview: changelog/index.md
          - 2025: changelog/2025.md
          - 2024: changelog/2024.md
          - 2023: changelog/2023.md
          - 2022: changelog/2022.md
          - 2021: changelog/2021.md
          - 2020: changelog/2020.md
  - Projects:
      - ShadowGrid: projects/shadowgrid.md
      - Client Implementation Board: projects/client-implementation-board.md
      - PM Grid: projects/pmgrid.md
      - ProXP: projects/proxp.md
      - mytendrils: projects/mytendrils.md
      - bg-mem: projects/bg-mem.md
  - What Revit Wants: https://wrw.is/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 2

extra_css:
  - stylesheets/blackgrid.css
  - stylesheets/changelog.css

extra_javascript:
  - javascripts/changelog.js
