site_name: Deep Space Capabilities
site_url: https://lukeyjohnson.github.io/bg-sites/
repo_url: https://github.com/lukeyjohnson/bg-sites/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - navigation.top
    - toc.follow
  palette: 
    scheme: default
    primary: indigo
    accent: blue

nav:
  - Home: index.md
  - Capabilities:
      - DS Pro (Technical): index.md#ds-pro
      - DS Harmony (Field): index.md#ds-harmony
      - DS Horizon (Ops): index.md#ds-horizon
  - Site and Mobile: siteapp.md
  - Changelog:
      - Overview: changelog/index.md
      - 2025: changelog/2025.md
      - 2024: changelog/2024.md
      - 2023: changelog/2023.md
      - 2022: changelog/2022.md
      - 2021: changelog/2021.md
      - 2020: changelog/2020.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.keys
  - toc:
      permalink: true
      toc_depth: 2

extra_css:
  - stylesheets/changelog.css

validation:
  nav:
    not_found: info   # nav uses index.md#anchor links on purpose; MkDocs cannot resolve anchors in nav
